# ============================================================================
# DAGents-InsightFlow nginx Configuration
# ============================================================================
# 安装方法:
#   sudo cp deploy/nginx-dagents.conf /etc/nginx/sites-available/dagents
#   sudo ln -s /etc/nginx/sites-available/dagents /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (Let's Encrypt):
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d your-domain.com
# ============================================================================

upstream dagents_backend {
    server 127.0.0.1:8000 fail_timeout=0;
}

upstream dagents_frontend {
    server 127.0.0.1:3000 fail_timeout=0;
}

server {
    listen 80;
    # listen 443 ssl http2;  # 获取 SSL 证书后取消注释
    server_name _;  # 替换为你的域名，如 dagents.example.com

    # ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    client_max_body_size 10m;

    # ── Backend API ─────────────────────────────────────────────
    # SSE 流式端点（访谈、事件推送）需要关闭缓冲
    location /api/ {
        proxy_pass http://dagents_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # ── Frontend ─────────────────────────────────────────────────
    location / {
        proxy_pass http://dagents_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（Next.js 热更新，生产环境可移除）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── 安全响应头 ───────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
