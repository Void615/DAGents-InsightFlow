# ============================================================================
# DAGents-InsightFlow nginx Configuration (Docker)
# ============================================================================
# 在 docker-compose 中作为反向代理容器运行
# 后端和前端通过容器名通信: backend:8000, frontend:3000
# ============================================================================

upstream dagents_backend {
    server backend:8000 fail_timeout=0;
}

upstream dagents_frontend {
    server frontend:3000 fail_timeout=0;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # ── Backend API ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://dagents_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式端点（访谈、事件推送）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # ── Frontend ─────────────────────────────────────────────────
    location / {
        proxy_pass http://dagents_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── 安全响应头 ───────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
