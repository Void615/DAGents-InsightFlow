# ============================================================================
# DAGents-InsightFlow Docker Compose
# ============================================================================
# 部署:
#   1. cp .env.docker .env   → 编辑 .env 填入真实密钥
#   2. docker compose up -d  → 启动所有服务
#   3. docker compose ps     → 检查运行状态
#   4. docker compose logs -f → 查看日志
#
# 更新:
#   docker compose build --no-cache
#   docker compose up -d
# ============================================================================

services:
  # ── PostgreSQL 16 ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: dagents-postgres
    environment:
      POSTGRES_USER: dagents
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: dagents
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dagents -d dagents"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - dagents

  # ── FastAPI Backend ───────────────────────────────────────────
  backend:
    build:
      context: ./backend
    container_name: dagents-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://dagents:${PG_PASSWORD}@postgres:5432/dagents
      DATABASE_URL_SYNC: postgresql://dagents:${PG_PASSWORD}@postgres:5432/dagents
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      LANGSMITH_TRACING_V2: ${LANGSMITH_TRACING_V2:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-dagents-insightflow}
    restart: unless-stopped
    networks:
      - dagents

  # ── Next.js Frontend ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        # 相对路径，由 nginx 统一代理前后端
        NEXT_PUBLIC_API_BASE_URL: /api/v1
    container_name: dagents-frontend
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dagents

  # ── nginx 反向代理 ───────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: dagents-nginx
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${PORT_HTTP:-80}:80"
      # HTTPS 先只监听，证书通过 certbot 或其他方式获取后挂载
      # - "443:443"
      # volumes:
      #   - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - dagents

volumes:
  pgdata:
    driver: local

networks:
  dagents:
    driver: bridge
